[package]
name = "coolprop-sys"
version = "7.2.3"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Raw FFI bindings to CoolProp"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["CoolProp", "ffi", "bindings"]
categories = ["api-bindings", "science"]
# Lets build.rs re-publish DEP_COOLPROP_WASM_ARTIFACT (received from its own
# coolprop-sys-wasm32-unknown-emscripten dependency, which is the one that
# declares `links = "coolprop"`) as DEP_COOLPROP_SYS_WASM_ARTIFACT, so
# dependents can read the wasm artifact path from this crate alone instead
# of also needing a direct path dependency on
# coolprop-sys-wasm32-unknown-emscripten just to see its `links` metadata
# (which Cargo only passes to *immediate* dependents).
links = "coolprop_sys"

[features]
regen-bindings = ["dep:bindgen"]
# Forwarded to coolprop-sys-wasm32-unknown-emscripten on wasm32-emscripten,
# where it actually controls how CoolProp gets built - on every other
# target this only affects bindings.rs's choice of bindings file (there's
# no equivalent toggle for the prebuilt native dylibs).
static-link = ["coolprop-sys-wasm32-unknown-emscripten/static-link"]
# Forwarded to coolprop-sys-wasm32-unknown-emscripten on wasm32-emscripten -
# see that crate's static-refprop feature doc. No effect on other targets.
static-refprop = ["coolprop-sys-wasm32-unknown-emscripten/static-refprop"]
# Forwarded to coolprop-sys-wasm32-unknown-emscripten on wasm32-emscripten -
# see that crate's prebuilt feature doc (requires static-link too). No
# effect on other targets (every other target already links a prebuilt
# dylib unconditionally - there's no from-source build to opt out of there).
prebuilt = ["coolprop-sys-wasm32-unknown-emscripten/prebuilt"]

[dependencies]
libloading.workspace = true

[build-dependencies]
bindgen = { workspace = true, optional = true }

[dev-dependencies]
static_assertions.workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
coolprop-sys-linux-aarch64 = { path = "../coolprop-sys-linux-aarch64", version = "7.2.3" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
coolprop-sys-linux-x86-64 = { path = "../coolprop-sys-linux-x86-64", version = "7.2.3" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
coolprop-sys-macos-aarch64 = { path = "../coolprop-sys-macos-aarch64", version = "7.2.3" }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
coolprop-sys-macos-x86-64 = { path = "../coolprop-sys-macos-x86-64", version = "7.2.3" }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
coolprop-sys-windows-aarch64 = { path = "../coolprop-sys-windows-aarch64", version = "7.2.3" }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
coolprop-sys-windows-x86-64 = { path = "../coolprop-sys-windows-x86-64", version = "7.2.3" }

[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "emscripten")))'.dependencies]
coolprop-sys-wasm32-unknown-emscripten = { path = "../coolprop-sys-wasm32-unknown-emscripten", version = "7.2.3" }