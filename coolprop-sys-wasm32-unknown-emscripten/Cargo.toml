[package]
name = "coolprop-sys-wasm32-unknown-emscripten"
version = "7.2.3"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CoolProp native binaries for WebAssembly (Wasm)"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["CoolProp", "native", "binaries", "WebAssembly", "Wasm"]
categories = ["api-bindings", "science"]
# Lets build.rs publish the built artifact's path to direct dependents via
# DEP_COOLPROP_WASM_ARTIFACT (Cargo's links-metadata mechanism) - only one
# crate in the whole dependency graph may declare a given `links` value,
# which is fine here since this is the only crate that actually compiles
# CoolProp for wasm32-unknown-emscripten. Must be a [package] key, not
# [lib] - it's silently ignored (never wired up to DEP_* at all) if placed
# after the [lib] table header instead.
links = "coolprop"

[lib]
crate-type = ["rlib"]

[features]
# Off (default): build+link CoolProp as an Emscripten shared library,
# dlopen'd at runtime by coolprop-sys's dynamic (libloading) bindings path.
# On: build+link libCoolProp.a directly into the final module - see
# heatpump-wasm's Cargo.toml for how this gets toggled end to end.
static-link = []
# Compiles CoolProp's REFPROP backend to call directly into a statically
# linked librefprop.a (see refprop-sys/lib/static) instead of dlopen()-ing
# librefprop.so at runtime. Unlike static-link (which is purely about how
# CoolProp itself gets linked), this changes CoolProp's C++ source: it
# defines COOLPROP_REFPROP_STATIC_LINK, which REFPROPMixtureBackend.cpp
# uses to skip its dlopen()/dlsym() dance entirely (see
# refprop_static_bindings.h in the vendored CoolProp checkout). This avoids
# needing Emscripten's -sMAIN_MODULE at link time - see heatpump-wasm's
# build.rs, where MAIN_MODULE is otherwise required for REFPROP's dlopen()
# and is incompatible with -sWASM_BINDGEN's module post-processing.
static-refprop = ["dep:refprop-sys"]
# Off (default): build CoolProp from ../vendor/CoolProp via cmake+em++, as
# static-link/static-refprop above already did - requires the full
# Emscripten SDK toolchain on PATH (see the workspace root CLAUDE.md).
# On: skip that build entirely and link the prebuilt libCoolProp.a checked
# in at lib/static-static-refprop/ instead - see build.rs and README.md.
# Meant for anyone who just wants to build heatpump-wasm without also
# setting up cmake+emsdk; doesn't change anything about *which* CoolProp
# gets linked, only how its binary was produced. Requires static-link (the
# only mode a prebuilt binary is shipped for - build.rs panics with a clear
# message if this is enabled without it).
prebuilt = []

[build-dependencies]
cmake = "0.1"

[dependencies]
refprop-sys = { path = "../../refprop-sys", version = "0.1.0", optional = true }